                $ref: '#/components/schemas/PodcastFull'
          links:
            paginate:
              operationId: getPodcastById
              parameters:
                next_episode_pub_date: $response.body#/next_episode_pub_date
              description: Pagination through episodes.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Podcaster API
      summary: Request to delete a podcast
      description: 'Podcast hosting services can use this endpoint to streamline the process of podcast
        deletion on behave of their users (podcasters). We will review the deletion request within 12
        hours. If the podcast is already deleted, the "status" field in the response will be "deleted".
        Otherwise, the status field will be "in review". If you want to get a notification once the podcast
        is deleted, you can configure a webhook url in the dashboard: listennotes.com/api/dashboard/#webhooks

        '
      operationId: deletePodcastById
