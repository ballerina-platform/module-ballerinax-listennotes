  /playlists/{id}:
    get:
      tags:
      - Playlist API
      summary: Fetch a playlist's info and items (i.e., episodes or podcasts).
      description: 'A playlist can contain both episodes and podcasts, shown in separate views,

        just like playlists created via listennotes.com/listen/.

        This endpoint fetches items from the saved default view unless **type** is specified.

        The response type and listennotes_url describe the selected view.

        You can use the **last_pub_date_ms** parameter to do pagination and fetch more items.

        A playlist can be **public** (discoverable on ListenNotes.com),

        **unlisted** (accessible to anyone who knows the playlist id),

        or **private** (accessible when the API admin has active playlist membership).

        Public and unlisted playlists can also be fetched by ID regardless of their owner.

        '
      operationId: getPlaylistById
      parameters:
      - name: id
        in: path
        description: 'Playlist id (always 11 characters, e.g., m1pe7z60bsw).

          You can get the podcast id from the url of a playlist, e.g.,

          m1pe7z60bsw is the playlist id of listennotes.com/listen/podcasts-about-podcasting-m1pe7z60bsw

          '
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: m1pe7z60bsw
      - name: type
        in: query
        description: 'Select **episode_list** or **podcast_list** to fetch that view.

          If omitted, use the playlist''s saved default type. This query parameter does not change the
          saved default

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: episode_list
          enum:
          - episode_list
          - podcast_list
      - name: last_timestamp_ms
        in: query
        description: 'For playlist items pagination.

          It''s the value of **last_timestamp_ms** from the response of last request.

          If it''s 0 or not specified, just return the latest or the oldest 20 items,

