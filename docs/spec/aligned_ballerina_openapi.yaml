openapi: 3.0.3
info:
  title: 'Listen API: Podcast Search, Directory, and Insights API'
  description: 'Simple & no-nonsense podcast search & directory API. Search all podcasts and episodes
    by people, places, or topics.

    '
  termsOfService: https://www.listennotes.com/api/terms/
  contact:
    name: Listen Notes
    url: https://www.listennotes.com/api/
    email: hello@listennotes.com
  version: '2.0'
servers:
- url: https://listen-api.listennotes.com/api/v2
  description: API Production Server
security:
- ListenApiKey: []
tags:
- name: Search API
  description: Endpoints to search podcasts
- name: Directory API
  description: Endpoints to fetch podcasts data
- name: Playlist API
  description: Endpoints to fetch and manage Listen Later playlists
- name: Podcaster API
  description: Endpoints to improve the podcast database
- name: Insights API
  description: Endpoints to get insights of podcasts, e.g., audience demographics
paths:
  /search:
    get:
      tags:
      - Search API
      summary: Full-text search
      description: 'Full-text search on episodes, podcasts, or curated lists of podcasts.

        Use the `offset` parameter to paginate through search results.

        The FREE plan allows to see up to 30 search results (or `offset` < 30) per query.

        The PRO plan allows to see up to 300 search results (or `offset` < 300) per query.

        The ENTERPRISE plan allows to see up to 10,000 search results (or `offset` < 10000) per query.

        '
      operationId: search
      parameters:
      - $ref: '#/components/parameters/queryParam'
      - name: sort_by_date
        in: query
        description: 'Sort by date or not? If 0, then sort by relevance. If 1, then sort by date

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 0
          enum:
          - 0
          - 1
          default: 0
        x-ballerina-name: sortByDate
      - name: type
        in: query
        description: "What type of contents do you want to search for? \n"
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: episode
          enum:
          - episode
          - podcast
          - curated
          default: episode
      - name: offset
        in: query
        description: 'Offset for search results, for pagination. You''ll use **next_offset** from response
          for this parameter

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 0
          default: 0
      - name: len_min
        in: query
        description: 'Minimum audio length in minutes. Applicable only when **type** parameter is **episode**
          or **podcast**.

          If **type** parameter is **episode**, it''s for audio length of an episode.

          If **type** parameter is **podcast**, it''s for average audio length of all episodes in a podcast

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 10
          default: 0
        x-ballerina-name: lenMin
      - name: len_max
        in: query
        description: 'Maximum audio length in minutes. Applicable only when **type** parameter is **episode**
          or **podcast**.

          If **type** parameter is **episode**, it''s for audio length of an episode.

          If **type** parameter is **podcast**, it''s for average audio length of all episodes in a podcast

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 30
        x-ballerina-name: lenMax
      - name: episode_count_min
        in: query
        description: 'Minimum number of episodes. Applicable only when type parameter is **podcast**

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
        x-ballerina-name: episodeCountMin
      - name: episode_count_max
        in: query
        description: 'Maximum number of episodes. Applicable only when type parameter is **podcast**

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
        x-ballerina-name: episodeCountMax
      - name: update_freq_min
        in: query
        description: 'Minimum update frequency in hours (how frequently does a podcast release a new episode).
          For example, if you want to find "weekly" podcasts, then you can set **update_freq_min**=144
          hours (or 6 days) and **update_freq_max**=192 hours (or 8 days). Applicable only when type parameter
          is **podcast**

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
        x-ballerina-name: updateFreqMin
      - name: update_freq_max
        in: query
        description: 'Maximum update frequency in hours (how frequently does a podcast release a new episode).
          For example, if you want to find "weekly" podcasts, then you can set **update_freq_min**=144
          hours (or 6 days) and **update_freq_max**=192 hours (or 8 days). Applicable only when type parameter
          is **podcast**

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
        x-ballerina-name: updateFreqMax
      - name: genre_ids
        in: query
        description: 'A comma-delimited string of a list of genre ids. If not specified, then all genres
          are included. You can find the id and the name of all genres from `GET /genres`. It works only
          when **type** is *episode* or *podcast*

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: 68,82
        x-ballerina-name: genreIds
      - name: published_before
        in: query
        description: "Only show episodes/podcasts/curated lists published before this Epoch Unix timestamp\
          \ (in milliseconds). \nIf **published_before** & **published_after** are used at the same time,\
          \ **published_before** should be bigger than **published_after**\n"
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 1580172454000
        x-ballerina-name: publishedBefore
      - name: published_after
        in: query
        description: "Only show episodes/podcasts/curated lists published after this Epoch Unix timestamp\
          \ (in milliseconds). \nIf **published_before** & **published_after** are used at the same time,\
          \ **published_before** should be bigger than **published_after**\n"
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 0
          default: 0
        x-ballerina-name: publishedAfter
      - name: only_in
        in: query
        description: 'A comma-delimited string to search only in specific fields. Allowed values are title,
          description, author, and audio. If not specified, then search every fields

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: title,description
          default: title,description,author,audio
        x-ballerina-name: onlyIn
      - name: language
        in: query
        description: 'Limit search results to a specific language. If not specified, it''ll be any language.
          You can get a list of supported languages from `GET /languages`. It works only when **type**
          is *episode* or *podcast*

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: English
      - name: region
        in: query
        description: 'Limit search results to a specific region (e.g., us, gb, in...). If not specified,
          it''ll be any region. You can get the supported country codes from `GET /regions`. It works
          only when **type** is *episode* or *podcast*

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: ''
      - name: ocid
        in: query
        description: 'A comma-delimited string of podcast ids (up to 5 podcasts) - you can get a podcast
          id from the **podcast_id** field in response. This parameter is to limit search results from
          only a few specific podcasts. It works only when **type** is *episode*

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: ncid
        in: query
        description: 'A comma-delimited string of podcast ids (up to 5 podcasts) - you can get a podcast
          id from the **podcast_id** field in response. This parameter is to exclude search results of
          a few specific podcasts. It works only when **type** is *episode*

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: safe_mode
        in: query
        description: 'Whether or not to exclude podcasts/episodes with explicit language. 1 is yes and
          0 is no. It works only when **type** is *episode* or *podcast*

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 0
          enum:
          - 0
          - 1
          default: 0
        x-ballerina-name: safeMode
      - name: unique_podcasts
        in: query
        description: 'Whether or not to keep only one episode per podcast in search results. 1 is yes
          and 0 is no. It works only when **type** is *episode*

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 0
          enum:
          - 0
          - 1
          default: 0
        x-ballerina-name: uniquePodcasts
      - name: interviews_only
        in: query
        description: "Whether or not to keep only podcasts that have guest interviews in search results.\
          \ 1 is yes and 0 is no. It works only when **type** is *podcast*. \nThis parameter is available\
          \ only in the PRO/ENTERPRISE plan\n"
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 0
          enum:
          - 0
          - 1
          default: 0
        x-ballerina-name: interviewsOnly
      - name: sponsored_only
        in: query
        description: 'Whether or not to keep only podcasts that have sponsors in search results. 1 is
          yes and 0 is no. It works only when **type** is *podcast*.

          This parameter is available only in the PRO/ENTERPRISE plan

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 0
          enum:
          - 0
          - 1
          default: 0
        x-ballerina-name: sponsoredOnly
      - name: page_size
        in: query
        description: 'The maximum number of search results per page. A valid value should be an integer
          between 1 and 10 (inclusive)

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 10
          default: 10
        x-ballerina-name: pageSize
      responses:
        '200':
          description: OK
          headers:
            X-ListenAPI-FreeQuota:
              $ref: '#/components/headers/X-ListenAPI-FreeQuota'
            X-ListenAPI-Usage:
              $ref: '#/components/headers/X-ListenAPI-Usage'
            X-listenAPI-Latency-Seconds:
              $ref: '#/components/headers/X-listenAPI-Latency-Seconds'
            X-ListenAPI-NextBillingDate:
              $ref: '#/components/headers/X-ListenAPI-NextBillingDate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          links:
            paginate:
              operationId: search
              parameters:
                offset: $response.body#/next_offset
              description: Pagination through search results.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
  /typeahead:
    get:
      tags:
      - Search API
      summary: Typeahead search
      description: Suggest search terms, podcast genres, and podcasts.
      operationId: typeahead
      parameters:
      - $ref: '#/components/parameters/queryParam'
      - name: show_podcasts
        in: query
        description: 'Autosuggest podcasts. This only searches podcast title and publisher and returns
          very limited info of 5 podcasts. 1 is yes, 0 is no. It''s a bit slow to autosuggest podcasts,
          so we turn it off by default. If show_podcasts=1, you can also pass iTunes id (e.g., 474722933)
          to the q parameter to fetch podcast meta data

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 1
          enum:
          - 0
          - 1
          default: 0
        x-ballerina-name: showPodcasts
      - name: show_genres
        in: query
        description: 'Whether or not to autosuggest genres. 1 is yes, 0 is no

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 1
          enum:
          - 0
          - 1
          default: 0
        x-ballerina-name: showGenres
      - name: safe_mode
        in: query
        description: 'Whether or not to exclude podcasts/episodes with explicit language. 1 is yes and
          0 is no. It works only when **show_podcasts** is *1*

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 0
          enum:
          - 0
          - 1
          default: 0
        x-ballerina-name: safeMode
      responses:
        '200':
          description: OK
          headers:
            X-ListenAPI-FreeQuota:
              $ref: '#/components/headers/X-ListenAPI-FreeQuota'
            X-ListenAPI-Usage:
              $ref: '#/components/headers/X-ListenAPI-Usage'
            X-listenAPI-Latency-Seconds:
              $ref: '#/components/headers/X-listenAPI-Latency-Seconds'
            X-ListenAPI-NextBillingDate:
              $ref: '#/components/headers/X-ListenAPI-NextBillingDate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeaheadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
  /search_episode_titles:
    get:
      tags:
      - Search API
      summary: Find individual episodes by searching for their titles
      description: "Conduct targeted searches for individual episodes by title and refine results using\
        \ the podcast id such as \nListen Notes Podcast ID, Apple Podcasts ID, Spotify ID, or RSS feed\
        \ URL. \nThis endpoint is specially designed to streamline the import of specific episodes from\
        \ platforms \nlike Apple Podcasts and Spotify into your application. \nCompared to the GET /search\
        \ endpoint, which performs full-text searches across multiple fields, \nthis endpoint focuses\
        \ solely on episode titles for enhanced accuracy and performance.\n"
      operationId: searchEpisodeTitles
      parameters:
      - name: q
        in: query
        description: 'An episode''s title, e.g., Jerusalem Demsas on The Dispossessed. You can use double
          quotes to do verbatim match, e.g., "Jerusalem Demsas on The Dispossessed". Otherwise, it''s
          fuzzy search

          '
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: Jerusalem Demsas on The Dispossessed
      - name: podcast_id
        in: query
        description: "Refine search results by specifying a podcast through its unique ID.\nThe format\
          \ of the podcast ID is governed by the podcast_id_type parameter. \nFor listennotes_id, the\
          \ podcast ID will look like 'cda18f20f1be4ac7b3cce7d0eb168fff'. \nFor itunes_id, it will be\
          \ a numerical value like '983795625'. \nFor spotify_id, expect a format like '0Z1234tGXD2hVhjFrrhJ7g'.\
          \ \nFor rss, the podcast ID will be the RSS URL, e.g., 'https://cowenconvos.libsyn.com/rss'\n"
        required: false
        style: form
        explode: true
        schema:
          type: string
        x-ballerina-name: podcastId
      - name: podcast_id_type
        in: query
        description: 'The type of podcast id. Valid values are **listennotes_id**, **itunes_id**, **spotify_id**,
          and **rss**.

          Note: **itunes_id** is for Apple Podcasts

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - listennotes_id
          - itunes_id
          - spotify_id
          - rss
          default: listennotes_id
        x-ballerina-name: podcastIdType
      responses:
        '200':
          description: OK
          headers:
            X-ListenAPI-FreeQuota:
              $ref: '#/components/headers/X-ListenAPI-FreeQuota'
            X-ListenAPI-Usage:
              $ref: '#/components/headers/X-ListenAPI-Usage'
            X-listenAPI-Latency-Seconds:
              $ref: '#/components/headers/X-listenAPI-Latency-Seconds'
            X-ListenAPI-NextBillingDate:
              $ref: '#/components/headers/X-ListenAPI-NextBillingDate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEpisodeTitlesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
  /trending_searches:
    get:
      tags:
      - Search API
      summary: Fetch trending search terms
      description: Fetch up to 10 most recent trending search terms on the Listen Notes platform.
      operationId: getTrendingSearches
      responses:
        '200':
          description: OK
          headers:
            X-ListenAPI-FreeQuota:
              $ref: '#/components/headers/X-ListenAPI-FreeQuota'
            X-ListenAPI-Usage:
              $ref: '#/components/headers/X-ListenAPI-Usage'
            X-listenAPI-Latency-Seconds:
              $ref: '#/components/headers/X-listenAPI-Latency-Seconds'
            X-ListenAPI-NextBillingDate:
              $ref: '#/components/headers/X-ListenAPI-NextBillingDate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendingSearchesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
  /related_searches:
    get:
      tags:
      - Search API
      summary: Fetch related search terms
      description: Suggest related search terms. The results are more comprehensive than from `GET /typeahead`.
        This endpoint is available only in the PRO/ENTERPRISE plan.
      operationId: getRelatedSearches
      parameters:
      - name: q
        in: query
        description: 'Search term, e.g., person, place, topic..

          '
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: evergrande
      responses:
        '200':
          description: OK
          headers:
            X-ListenAPI-FreeQuota:
              $ref: '#/components/headers/X-ListenAPI-FreeQuota'
            X-ListenAPI-Usage:
              $ref: '#/components/headers/X-ListenAPI-Usage'
            X-listenAPI-Latency-Seconds:
              $ref: '#/components/headers/X-listenAPI-Latency-Seconds'
            X-ListenAPI-NextBillingDate:
              $ref: '#/components/headers/X-ListenAPI-NextBillingDate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedSearchesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
  /spellcheck:
    get:
      tags:
      - Search API
      summary: Spell check on a search term
      description: Suggest a list of words that correct the spelling errors of a search term. This endpoint
        is available only in the PRO/ENTERPRISE plan.
      operationId: spellcheck
      parameters:
      - name: q
        in: query
        description: 'Search term, e.g., person, place, topic..

          '
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: microsft stock
      responses:
        '200':
          description: OK
          headers:
            X-ListenAPI-FreeQuota:
              $ref: '#/components/headers/X-ListenAPI-FreeQuota'
            X-ListenAPI-Usage:
              $ref: '#/components/headers/X-ListenAPI-Usage'
            X-listenAPI-Latency-Seconds:
              $ref: '#/components/headers/X-listenAPI-Latency-Seconds'
            X-ListenAPI-NextBillingDate:
              $ref: '#/components/headers/X-ListenAPI-NextBillingDate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpellCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
  /best_podcasts:
    get:
      tags:
      - Directory API
      summary: Fetch a list of best podcasts by genre
      description: 'Get a list of curated best podcasts by genre,

        which are curated by Listen Notes staffs based on various signals from the Internet, e.g.,

        top charts on other podcast platforms, recommendations from mainstream media,

        user activities on listennotes.com...

        You can get the genre ids from `GET /genres` endpoint.

        This endpoint returns same data as https://www.listennotes.com/best-podcasts/

        '
      operationId: getBestPodcasts
      parameters:
      - $ref: '#/components/parameters/genreIdParam'
      - name: page
        in: query
        description: Page number of those podcasts in this genre
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 2
      - name: region
        in: query
        description: 'Filter best podcasts by country/region.

          Please note that podcasts that are "best" in a country/region may not be produced in that country/region.

          For example, a podcast from the US may be very popular in Canada.

          You can get the supported country codes (e.g., us, jp, gb...) from `GET /regions`.

          If not specified, you''ll get "best podcasts" in United States

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: us
          default: us
      - name: publisher_region
        in: query
        description: 'Filter best podcasts by the publisher''s country/region.

          This is to narrow down the results to include "best podcasts" produced in a specific country/region.

          You can get the supported country codes (e.g., us, jp, gb...) from `GET /regions`.

          If not specified, you''ll get "best podcasts" produced in any country/region.

          If you want to get a country/region''s "best podcasts" that are also produced in that country/region,

          then you need to specify both **region** and **publisher_region**,

          e.g., `region=jp` and `publisher_region=jp`

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
        x-ballerina-name: publisherRegion
      - name: language
        in: query
        description: 'Filter best podcasts by language.

          You can get a list of supported languages (e.g., English, Chinese, Japanese...) from `GET /languages`.

          If not specified, you''ll get "best podcasts" in any language

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: sort
        in: query
        description: 'How do you want to sort these podcasts?

          If you''d like to sort by popularity, please use **listen_score**

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - recent_added_first
          - oldest_added_first
          - recent_published_first
          - oldest_published_first
          - listen_score
          default: recent_added_first
        example: listen_score
      - $ref: '#/components/parameters/safeModeParam'
      responses:
        '200':
          description: OK
          headers:
            X-ListenAPI-FreeQuota:
              $ref: '#/components/headers/X-ListenAPI-FreeQuota'
            X-ListenAPI-Usage:
              $ref: '#/components/headers/X-ListenAPI-Usage'
            X-listenAPI-Latency-Seconds:
              $ref: '#/components/headers/X-listenAPI-Latency-Seconds'
            X-ListenAPI-NextBillingDate:
              $ref: '#/components/headers/X-ListenAPI-NextBillingDate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestPodcastsResponse'
          links:
            paginate:
              operationId: getBestPodcasts
              parameters:
                page: $response.body#/next_page_number
              description: Pagination through podcasts.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        5XX:
          $ref: '#/components/responses/ServerError'
  /podcasts/{id}:
    get:
      tags:
      - Directory API
      summary: Fetch detailed meta data and episodes for a podcast by id
      description: 'Fetch detailed meta data and episodes for a specific podcast (up to 10 episodes each
        time).

        You can use the **next_episode_pub_date** parameter to do pagination and fetch more episodes.

        During pagination with **next_episode_pub_date**, an empty **episodes** array in the response
        signals that no more episodes are available.

        '
      operationId: getPodcastById
      parameters:
      - name: id
        in: path
        description: Podcast id. You can get podcast id from using other endpoints, e.g., `GET /search`,
          `GET /best_podcasts`..
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 4d3fe717742d4963a85562e9f84d8c79
      - name: next_episode_pub_date
        in: query
        description: 'For episodes pagination. It''s the value of **next_episode_pub_date** from the response
          of last request. If not specified, just return latest 10 episodes or oldest 10 episodes, depending
          on the value of the **sort** parameter.

          It is an Epoch Unix timestamp in milliseconds.

          During pagination with **next_episode_pub_date**, an empty **episodes** array in the response
          signals that no more episodes are available

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
        example: 1479154463000
        x-ballerina-name: nextEpisodePubDate
      - name: sort
        in: query
        description: 'How do you want to sort the episodes of this podcast?

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - recent_first
          - oldest_first
          default: recent_first
        example: recent_first
      responses:
        '200':
          description: OK
          headers:
            X-ListenAPI-FreeQuota:
              $ref: '#/components/headers/X-ListenAPI-FreeQuota'
            X-ListenAPI-Usage:
              $ref: '#/components/headers/X-ListenAPI-Usage'
            X-listenAPI-Latency-Seconds:
              $ref: '#/components/headers/X-listenAPI-Latency-Seconds'
            X-ListenAPI-NextBillingDate:
