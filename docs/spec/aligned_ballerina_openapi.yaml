components:
  schemas:
    UpdatePlaylistRequest:
      minProperties: 1
      type: object
      properties:
        visibility:
          type: string
          description: Who can view the playlist. Creation defaults to public
          example: public
          enum:
          - public
          - unlisted
          - private
        name:
          maxLength: 4096
          minLength: 1
          type: string
